<title>세방 조직도</title>
<style>
@font-face { font-family: 'SBG'; font-weight: 400; src: local('세방고딕 2.0 Regular'), local('SEBANG GOTHIC 2.0 Regular'); }
@font-face { font-family: 'SBG'; font-weight: 700; src: local('세방고딕 2.0 Bold'), local('SEBANG GOTHIC 2.0 Bold'); }
:root { --bg: #f5f5f7; --fg: #1d1d1f; --strong: #1f4e8c; --card: #fff; --line: #d2d2d7; --a: #1b5fc4; --b: #4a9bf5; --err: #c62828; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --strong: #b9d6ff; --card: #1c1c1e; --line: #48484a; --err: #ff6b6b; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font-family: 'SBG', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
form { width: min(360px, 100%); background: var(--card); border-radius: 22px; padding: 30px 24px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.08); display: grid; gap: 14px; text-align: center; }
.badge { width: 64px; height: 64px; margin: 0 auto 4px; border-radius: 16px; background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
h1 { margin: 0; font-size: 24px; color: var(--strong); letter-spacing: -.01em; }
p { margin: 0; font-size: 14px; line-height: 1.5; }
input[type=password] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: center; }
label { font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: center; }
button { font: inherit; font-size: 17px; font-weight: 700; padding: 12px; border: 0; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--a), var(--b)); cursor: pointer; }
button:disabled { opacity: .6; }
.msg { min-height: 1.4em; font-size: 14px; color: var(--err); }
:focus-visible { outline: 3px solid var(--b); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="badge">SEBANG</div>
  <h1>세방 조직도</h1>
  <p>사내 비밀번호를 입력하면 열립니다.</p>
  <input id="pw" type="password" inputmode="text" placeholder="비밀번호" aria-label="비밀번호" required>
  <label><input id="keep" type="checkbox" checked> 이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <div class="msg" id="msg" role="status"></div>
</form>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'sebang-org-key';
async function open(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.i) }, k, ub(P.c)));
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(P.s), iterations: P.n }, base, 256));
}

    msg.textContent = '비밀번호가 맞지 않습니다. 다시 입력해 주세요.';
    go.disabled = false; go.textContent = '열기';
  }
});
